<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode player</title>
<style>
  :root { --ink:#25303B; --bg:#F7F5F0; --card:#FFFFFF; --teal:#2A7FBA; --coral:#E4572E; --line:#E3DED3; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:20px 28px 8px; }
  h1 { margin:0; font-size:26px; }
  .sub { margin:2px 0 8px; color:#5C6B7A; }
  .notice { display:inline-block; margin:4px 0 0; padding:4px 10px; font-size:13px; background:#FFF1D6; border:1px solid #F2A541; border-radius:6px; }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:22px; padding:12px 28px 32px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #stage { width:100%; aspect-ratio:1/1; max-height:520px; object-fit:contain; background:#EFEAE0; border-radius:8px; }
  audio { width:100%; margin-top:10px; }
  h2 { margin:0 0 8px; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:#5C6B7A; }
  #chapters { display:flex; flex-direction:column; gap:6px; }
  #chapters button { text-align:left; padding:8px 10px; font:inherit; background:#fff; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  #chapters button.on { border-color:var(--teal); background:#DCEBFA; }
  #transcript { max-height:430px; overflow:auto; }
  .line { padding:8px 10px; border-left:4px solid transparent; border-radius:6px; }
  .line.on { background:#FFF7F2; border-left-color:var(--coral); }
  .host { font-size:12px; font-weight:700; color:var(--teal); text-transform:uppercase; }
  .w.now { background:#FFD9C7; border-radius:3px; }
  #cites { margin-top:12px; }
  .cite { padding:8px 10px; margin-top:6px; background:#F1F6FB; border-left:4px solid var(--teal); border-radius:6px; font-size:14px; }
  .cite small { display:block; color:#5C6B7A; }
  a { color:var(--teal); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <span class="notice" id="disclosure"></span>
</header>
<main>
  <section>
    <div class="panel">
      <img id="stage" alt="Illustration for the current chapter">
      <audio id="audio" controls preload="metadata"></audio>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Chapters</h2>
      <div id="chapters"></div>
    </div>
  </section>
  <section>
    <div class="panel">
      <h2>Transcript</h2>
      <div id="transcript"></div>
      <div id="cites"></div>
    </div>
  </section>
</main>
<script type="application/json" id="episode">__EPISODE_DATA__</script>
<script>
  // All episode text goes in with textContent, so nothing in the data can run as markup.
  const data = JSON.parse(document.getElementById("episode").textContent);
  const $ = (id) => document.getElementById(id);
  $("title").textContent = data.title;
  $("subtitle").textContent = data.subtitle || "";
  $("disclosure").textContent = data.disclosure;
  const audio = $("audio");
  audio.src = data.audio;
  const stage = $("stage");
  stage.src = data.cover;

  const chapterButtons = new Map();
  data.chapters.forEach((chapter) => {
    const button = document.createElement("button");
    button.textContent = chapter.title;
    button.addEventListener("click", () => { audio.currentTime = chapter.start; audio.play(); });
    $("chapters").appendChild(button);
    chapterButtons.set(chapter.id, button);
  });

  const lineNodes = new Map();
  const wordNodes = [];
  data.lines.forEach((line) => {
    const box = document.createElement("div");
    box.className = "line";
    const who = document.createElement("div");
    who.className = "host";
    who.textContent = line.hostName;
    const text = document.createElement("div");
    const words = data.words.filter((w) => w.start >= line.start - 0.05 && w.start < line.end);
    (words.length ? words : [{ w: line.text, start: line.start, end: line.end }]).forEach((word, i) => {
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = (i ? " " : "") + word.w;
      span.dataset.start = word.start;
      span.dataset.end = word.end;
      text.appendChild(span);
      wordNodes.push(span);
    });
    box.append(who, text);
    box.addEventListener("click", () => { audio.currentTime = line.start; audio.play(); });
    $("transcript").appendChild(box);
    lineNodes.set(line.id, box);
  });

  let currentLine = null, currentChapter = null;
  function showCites(line) {
    const holder = $("cites");
    holder.replaceChildren();
    if (!line.cites.length) return;
    const heading = document.createElement("h2");
    heading.textContent = "From the card";
    holder.appendChild(heading);
    line.cites.forEach((cite) => {
      const box = document.createElement("div");
      box.className = "cite";
      box.textContent = "\u201C" + cite.text + "\u201D";
      const small = document.createElement("small");
      const link = document.createElement("a");
      link.textContent = cite.card + " card";
      link.href = cite.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      small.append(link, document.createTextNode(", " + cite.context));
      box.appendChild(small);
      holder.appendChild(box);
    });
  }

  audio.addEventListener("timeupdate", () => {
    const t = audio.currentTime;
    const chapter = data.chapters.find((c) => t >= c.start && t < c.end) || null;
    if (chapter !== currentChapter) {
      if (currentChapter) chapterButtons.get(currentChapter.id).classList.remove("on");
      currentChapter = chapter;
      if (chapter) { chapterButtons.get(chapter.id).classList.add("on"); stage.src = chapter.image; }
    }
    const line = data.lines.find((l) => t >= l.start && t < l.end) || null;
    if (line !== currentLine) {
      if (currentLine) lineNodes.get(currentLine.id).classList.remove("on");
      currentLine = line;
      if (line) {
        const node = lineNodes.get(line.id);
        node.classList.add("on");
        node.scrollIntoView({ block: "nearest", behavior: "smooth" });
        showCites(line);
      }
    }
    wordNodes.forEach((span) => span.classList.toggle("now", t >= +span.dataset.start && t < +span.dataset.end));
  });
</script>
</body>
</html>
